<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galleria — Bielle Shot</title>
<meta name="description" content="Galleria fotografica automotive e ritratti di Bielle Shot.">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-container">
  <nav class="nav">
    <a href="index.html" class="nav__logo-link">
      <img src="IMG_2298.png" alt="Bielle Shot" class="nav__logo-img">
    </a>
    <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Apri menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav__menu" id="navMenu">
      <a href="index.html">Home</a>
      <a href="galleria.html">Galleria</a>
      <a href="contatti.html">Contatti</a>
    </div>
  </nav>

  <!-- ===================== GALLERIA ===================== -->
  <main>
    <header class="gallery-head">
      <div class="wrap">
        <h1 class="gallery-head__title">Galleria</h1>
        <p class="gallery-head__sub">I miei scatti in evidenza.</p>
      </div>
    </header>

    <section class="section" style="padding-top: 24px; padding-bottom: 60px;">
      <div class="wrap">
        <!-- Griglia per le foto HDR in PNG -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
          
          <div style="border: 1px solid var(--line); overflow: hidden; aspect-ratio: 4/3;">
            <img src="Foto1.png" alt="Bielle Shot HDR 1" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          </div>
          
          <div style="border: 1px solid var(--line); overflow: hidden; aspect-ratio: 4/3;">
            <img src="Foto2.png" alt="Bielle Shot HDR 2" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          </div>
          
          <div style="border: 1px solid var(--line); overflow: hidden; aspect-ratio: 4/3;">
            <img src="Foto3.png" alt="Bielle Shot HDR 3" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          </div>
          
          <div style="border: 1px solid var(--line); overflow: hidden; aspect-ratio: 4/3;">
            <img src="Foto4.png" alt="Bielle Shot HDR 4" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          </div>
          
          <div style="border: 1px solid var(--line); overflow: hidden; aspect-ratio: 4/3;">
            <img src="Foto5.png" alt="Bielle Shot HDR 5" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          </div>

          <div style="border: 1px solid var(--line); overflow: hidden; aspect-ratio: 4/3;">
            <img src="Foto6.png" alt="Bielle Shot HDR 6" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          </div>

        </div>
      </div>
    </section>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <div class="wrap">
      <div class="footer__row">
        <h2 class="footer__title">Parliamo del tuo prossimo shooting.</h2>
        <a href="contatti.html" class="footer__cta">Scrivimi →</a>
      </div>
      <div class="footer__meta">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <span>© <span id="year"></span> Bielle Shot</span>
          <span style="font-size: 12px; opacity: 0.8;">Parma, Emilia-Romagna</span>
        </div>
        <a href="https://instagram.com/bi.elle_shot" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </footer>
</div>

<script src="main.js"></script>
</body>
</html>
