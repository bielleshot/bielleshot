<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galleria — Bielle Shot</title>
<meta name="description" content="Galleria fotografica automotive e ritratti di Bielle Shot.">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-container">
  <nav class="nav">
    <a href="index.html" class="nav__logo-link">
      <img src="IMG_2298.png" alt="Bielle Shot" class="nav__logo-img">
    </a>
    <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Apri menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav__menu" id="navMenu">
      <a href="index.html">Home</a>
      <a href="galleria.html">Galleria</a>
      <a href="contatti.html">Contatti</a>
    </div>
  </nav>

  <!-- ===================== GALLERIA ===================== -->
  <main>
    <header class="gallery-head">
      <div class="wrap">
        <h1 class="gallery-head__title">Galleria</h1>
        <p class="gallery-head__sub">Quattro album, quattro modi di guardare le cose.</p>
      </div>
    </header>

    <section class="section" style="padding-top: 24px;">
      <div class="wrap">
        <div class="grid grid--albums" style="display: flex; flex-direction: column; gap: 24px; max-width: 800px; margin: 0 auto;">
          
          <!-- Album Auto -->
          <a href="auto.html" class="album-card" style="display: block; background: #000; border: 1px solid var(--line); overflow: hidden; text-decoration: none; position: relative;">
            <div class="ph" style="padding: 0; overflow: hidden; height: auto;">
              <!-- Sostituisci l'immagine di copertina quando vorrai -->
              <img src="Foto1.png" alt="Auto" style="width: 100%; height: auto; display: block;">
            </div>
            <span class="album-card__name" style="padding: 12px; display: block; color: var(--text); font-weight: 500;">Auto</span>
          </a>

          <!-- Album Ritratti -->
          <a href="ritratti.html" class="album-card" style="display: block; background: #000; border: 1px solid var(--line); overflow: hidden; text-decoration: none; position: relative;">
            <div class="ph" style="padding: 0; overflow: hidden; height: auto;">
              <!-- Sostituisci l'immagine di copertina quando vorrai -->
              <img src="Foto3.png" alt="Ritratti" style="width: 100%; height: auto; display: block;">
            </div>
            <span class="album-card__name" style="padding: 12px; display: block; color: var(--text); font-weight: 500;">Ritratti</span>
          </a>

          <!-- Album Paesaggi -->
          <a href="paesaggi.html" class="album-card" style="display: block; background: #000; border: 1px solid var(--line); overflow: hidden; text-decoration: none; position: relative;">
            <div class="ph" style="padding: 0; overflow: hidden; height: auto;">
              <!-- Sostituisci l'immagine di copertina quando vorrai -->
              <img src="Foto4.png" alt="Paesaggi" style="width: 100%; height: auto; display: block;">
            </div>
            <span class="album-card__name" style="padding: 12px; display: block; color: var(--text); font-weight: 500;">Paesaggi</span>
          </a>

          <!-- Album Mix -->
          <a href="mix.html" class="album-card" style="display: block; background: #000; border: 1px solid var(--line); overflow: hidden; text-decoration: none; position: relative;">
            <div class="ph" style="padding: 0; overflow: hidden; height: auto;">
              <img src="Foto6.png" alt="Mix" style="width: 100%; height: auto; display: block;">
            </div>
            <span class="album-card__name" style="padding: 12px; display: block; color: var(--text); font-weight: 500;">Mix</span>
          </a>

        </div>
      </div>
    </section>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <div class="wrap">
      <div class="footer__row">
        <h2 class="footer__title">Parliamo del tuo prossimo shooting.</h2>
        <a href="contatti.html" class="footer__cta">Scrivimi →</a>
      </div>
      <div class="footer__meta">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <span>© <span id="year"></span> Bielle Shot</span>
          <span style="font-size: 12px; opacity: 0.8;">Parma, Emilia-Romagna</span>
        </div>
        <a href="https://instagram.com/bi.elle_shot" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </footer>
</div>

<script src="main.js"></script>
</body>
</html>
