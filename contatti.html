<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatti — Bielle Shot</title>
<meta name="description" content="Scrivi a Bielle Shot per uno shooting auto o ritratti a Parma.">

<!-- Open Graph / Social -->
<meta property="og:title" content="Contatti — Bielle Shot">
<meta property="og:description" content="Prenota uno shooting automotive o ritretto a Parma.">
<meta property="og:image" content="408.jpeg">

<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__mark">Bielle Shot</a>
  <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Apri menu">
    <span></span><span></span><span></span>
  </button>
  <div class="nav__menu" id="navMenu">
    <a href="index.html">Home</a>
    <a href="galleria.html">Galleria</a>
    <a href="contatti.html">Contatti</a>
  </div>
</nav>

<main class="contact">
  <div class="wrap">
    <h1 class="contact__title">Raccontami la tua idea di shooting.</h1>

    <form action="https://formspree.io/f/xjglnnkn" method="POST">
      <!-- Reindirizzamento automatico alla pagina grazie.html -->
      <input type="hidden" name="_next" value="grazie.html">
      
      <div class="field">
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="type">Tipo di shooting</label>
        <input type="text" id="type" name="type" placeholder="Auto, ritratto, altro...">
      </div>
      <div class="field">
        <label for="message">Messaggio</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit">Invia richiesta</button>
    </form>

    <a href="index.html" class="back-link">← Torna al sito</a>
  </div>
</main>

<script src="main.js"></script>
</body>
</html>
