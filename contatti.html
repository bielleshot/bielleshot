<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatti — bi.elle_shot</title>
<meta name="description" content="Scrivi a bi.elle_shot per uno shooting auto o ritratti.">

<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__mark">bi.elle_shot</a>
  <div class="nav__links">
    <a href="index.html#auto">Auto</a>
    <a href="index.html#ritratti">Ritratti</a>
    <a href="contatti.html">Contatti</a>
  </div>
</nav>

<main class="contact">
  <div class="wrap">
    <h1 class="contact__title">Raccontami la tua idea di shooting.</h1>

    <!--
      SOSTITUISCI "TUO_ID_FORMSPREE" con l'endpoint reale del tuo account Formspree
      (es. https://formspree.io/f/xxxxxxx)
    -->
    <form action="https://formspree.io/f/TUO_ID_FORMSPREE" method="POST">
      <div class="field">
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="type">Tipo di shooting</label>
        <input type="text" id="type" name="type" placeholder="Auto, ritratto, altro...">
      </div>
      <div class="field">
        <label for="message">Messaggio</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit">Invia richiesta</button>
    </form>

    <a href="index.html" class="back-link">← Torna al sito</a>
  </div>
</main>

<script src="main.js"></script>
</body>
</html>
