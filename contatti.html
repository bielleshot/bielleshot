<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatti — Bielle Shot</title>
<meta name="description" content="Contatta Bielle Shot per il tuo prossimo shooting fotografico a Parma.">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-container">
  <nav class="nav">
    <a href="index.html" class="nav__logo-link">
      <img src="IMG_2298.png" alt="Bielle Shot" class="nav__logo-img">
    </a>
    <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Apri menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav__menu" id="navMenu">
      <a href="index.html">Home</a>
      <a href="galleria.html">Galleria</a>
      <a href="contatti.html">Contatti</a>
    </div>
  </nav>

  <!-- ===================== CONTATTI ===================== -->
  <main class="contact">
    <div class="wrap">
      <h1 class="contact__title">Raccontami la tua idea di shooting.</h1>

      <form action="#" method="POST">
        <div class="field">
          <label for="name">Nome</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
          <label for="type">Tipo di shooting</label>
          <input type="text" id="type" name="type" placeholder="Auto, ritratto, altro...">
        </div>

        <div class="field">
          <label for="message">Messaggio</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit">Invia richiesta</button>
      </form>

      <a href="index.html" class="back-link">← Torna al sito</a>
    </div>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <div class="wrap">
      <div class="footer__meta" style="margin-top: 0;">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <span>© <span id="year"></span> Bielle Shot</span>
          <span style="font-size: 12px; opacity: 0.8;">Parma, Emilia-Romagna</span>
        </div>
        <a href="https://instagram.com/bi.elle_shot" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </footer>
</div>

<script src="main.js"></script>
</body>
</html>
