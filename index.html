<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bi.elle Detailing - Fotografia Automotive</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #ffffff;
      --line: #222222;
    }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .hero__figure {
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
    }
    .hero__figure img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1>Bi.elle Detailing</h1>
    <p>Non è solo come appare, è come lo guardi.</p>
    
    <!-- Blocco della foto con adattamento automatico (verticale o orizzontale) -->
    <div class="hero__figure">
      <img src="408.webp" alt="Fotografia Automotive Bielle Shot" fetchpriority="high">
    </div>
  </header>

</body>
</html>
